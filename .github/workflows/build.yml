name: Build Packages
on:
  push:
    branches:
      - main
    paths:
      - 'srcpkgs/**'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to build (zen-browser-bin / google-chrome-bin / helium-browser-bin / mayulite-bin / brave-origin-beta / iosevkaku-bin / mayucode-bin / driftwm / all)'
        required: false
        default: 'all'
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: zen-browser-bin
            restricted: false
          - package: google-chrome-bin
            restricted: true
          - package: helium-browser-bin
            restricted: false
          - package: brave-origin-beta
            restricted: true
          - package: iosevkaku-bin
            restricted: false
          - package: mayucode-bin
            restricted: false
          - package: driftwm
            restricted: false

    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full
      options: --privileged
      volumes:
        - /dev:/dev
      env:
        ARCH: x86_64
        BOOTSTRAP: x86_64
        TEST: 0

    steps:
      - name: Check if this package should be built
        id: filter
        shell: sh
        run: |
          PKG="${{ matrix.package }}"
          EVENT="${{ github.event_name }}"
          INPUT="${{ github.event.inputs.package }}"
          MSG="${{ github.event.head_commit.message }}"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$INPUT" = "$PKG" ] || [ "$INPUT" = "all" ]; then
              echo "run=true" >> $GITHUB_OUTPUT
            else
              echo "run=false" >> $GITHUB_OUTPUT
            fi
          elif [ "$EVENT" = "push" ]; then
            if echo "$MSG" | grep -qF "$PKG"; then
              echo "run=true" >> $GITHUB_OUTPUT
            else
              echo "run=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi

      - name: Prepare container
        if: steps.filter.outputs.run == 'true'
        run: |
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf
          xbps-install -Syu xbps && xbps-install -yu && xbps-install -y sudo bash curl git
          useradd -G xbuilder -M builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder

      - name: Checkout repo
        if: steps.filter.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Checkout void-packages
        if: steps.filter.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: void-linux/void-packages
          path: void-packages

      - name: Merge template
        if: steps.filter.outputs.run == 'true'
        run: |
          cp -rv main-repo/srcpkgs/${{ matrix.package }} void-packages/srcpkgs/
          chown -R builder:builder void-packages

      - name: Prepare masterdir
        if: steps.filter.outputs.run == 'true'
        run: |
          cd void-packages
          sudo -Eu builder common/travis/set_mirror.sh
          sudo -Eu builder common/travis/prepare.sh
          common/travis/fetch-xtools.sh

      - name: Enable restricted packages
        if: steps.filter.outputs.run == 'true' && matrix.restricted == true
        run: |
          mkdir -p void-packages/common/conf
          echo "XBPS_ALLOW_RESTRICTED=yes" | sudo tee -a void-packages/common/conf/make.conf

      - name: Build ${{ matrix.package }}
        if: steps.filter.outputs.run == 'true'
        run: |
          export PATH="/opt/xbps/usr/bin/:$PATH"
          cd void-packages
          sudo -Eu builder ./xbps-src -j$(nproc) pkg ${{ matrix.package }}

      - name: Upload build artifacts
        if: steps.filter.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pkgs-${{ matrix.package }}
          path: |
            void-packages/hostdir/binpkgs/**/*.xbps
            void-packages/hostdir/binpkgs/**/*.xbps.sig2
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to Cloudflare Pages
    needs: build
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full
      options: --privileged
      volumes:
        - /dev:/dev

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Prepare container
        run: |
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf
          xbps-install -Syu xbps && xbps-install -yu && xbps-install -y curl nodejs npm
          npm install -g wrangler

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pkgs-*
          path: /tmp/new-pkgs
          merge-multiple: true

      - name: Check if any packages were built
        id: check
        run: |
          if find /tmp/new-pkgs -name "*.xbps" 2>/dev/null | grep -q .; then
            echo "has_pkgs=true" >> $GITHUB_OUTPUT
          else
            echo "has_pkgs=false" >> $GITHUB_OUTPUT
          fi

      # Cache key pakai repo name saja supaya selalu restore state terakhir
      - name: Restore repo cache
        if: steps.check.outputs.has_pkgs == 'true'
        uses: actions/cache@v4
        with:
          path: /tmp/repo
          key: xbps-repo-state
          restore-keys: xbps-repo-state

      - name: Merge new packages into repo
        if: steps.check.outputs.has_pkgs == 'true'
        run: |
          mkdir -p /tmp/repo
          find /tmp/new-pkgs -name "*.xbps" -exec cp -f {} /tmp/repo/ \;

      - name: Cleanup old versions
        if: steps.check.outputs.has_pkgs == 'true'
        run: |
          cd /tmp/repo
          for pkg in zen-browser-bin google-chrome-bin helium-browser-bin \
                     mayulite-bin brave-origin-beta iosevkaku-bin \
                     ioskeley-bin cidmono-bin piemono-bin mayucode-bin driftwm; do
            ls -t ${pkg}-*.xbps 2>/dev/null | tail -n +2 | xargs -r rm -f
          done

      - name: Sign and index
        if: steps.check.outputs.has_pkgs == 'true'
        env:
          PRIV_KEY: ${{ secrets.PRIV_KEY }}
        run: |
          export PATH="/opt/xbps/usr/bin/:$PATH"
          cd /tmp/repo
          rm -f x86_64-repodata *.xbps.sig2
          echo "$PRIV_KEY" > private.pem
          xbps-rindex -a *.xbps
          xbps-rindex -s --signedby "solocco" --privkey private.pem $PWD
          xbps-rindex -S --privkey private.pem *.xbps
          rm -f private.pem

      - name: Prepare public dir
        if: steps.check.outputs.has_pkgs == 'true'
        run: |
          mkdir -p /tmp/public/keys
          cp /tmp/repo/*.xbps /tmp/public/
          cp /tmp/repo/*.xbps.sig2 /tmp/public/
          cp /tmp/repo/x86_64-repodata /tmp/public/
          chmod +x main-repo/scripts/generate-index.sh
          main-repo/scripts/generate-index.sh /tmp/public main-repo/srcpkgs

      - name: Deploy to Cloudflare Pages
        if: steps.check.outputs.has_pkgs == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          wrangler pages deploy /tmp/public \
            --project-name=solocco-void-packages \
            --branch=main \
            --commit-dirty=true
