name: Update Check
on:
  workflow_dispatch:
  schedule:
    # Setiap Senin dan Kamis jam 07:00 WIB (00:00 UTC)
    - cron: '0 0 * * 1,4'

permissions:
  contents: write

jobs:
  load-matrix:
    name: Load package list
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.set.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build matrix from packages.json
        id: set
        run: echo "packages=$(jq -c '[.packages[].package]' packages.json)" >> "$GITHUB_OUTPUT"

  update:
    name: Check ${{ matrix.package }} updates
    needs: load-matrix
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.load-matrix.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup commit signing
        run: |
          echo "${{ secrets.SIGNING_KEY }}" > /tmp/signing_key
          chmod 600 /tmp/signing_key
          git config --global gpg.format ssh
          git config --global user.signingkey /tmp/signing_key
          git config --global commit.gpgsign true
          git config --global user.name "solocco"
          git config --global user.email "${{ secrets.SIGNING_EMAIL }}"

      - name: Run update script
        id: update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x "scripts/update-${{ matrix.package }}.sh"
          "./scripts/update-${{ matrix.package }}.sh"

      - name: Pull latest changes
        if: env.NEW_VERSION != ''
        run: |
          git stash
          git pull --rebase origin main
          git stash pop

      - name: Commit and push
        if: env.NEW_VERSION != ''
        uses: EndBug/add-and-commit@v9
        with:
          author_name: solocco
          author_email: ${{ secrets.SIGNING_EMAIL }}
          message: "Update ${{ matrix.package }} to ${{ env.NEW_VERSION }}"
          add: "srcpkgs/${{ matrix.package }}/template"
          github_token: ${{ secrets.PAT_TOKEN }}
