name: Update Check
on:
  workflow_dispatch:
  schedule:
    # Setiap Senin dan Kamis jam 07:00 WIB (00:00 UTC)
    - cron: '0 0 * * 1,4'

permissions:
  contents: write

jobs:
  # ==================== ZEN BROWSER ====================
  update-zen-browser-bin:
    name: Check zen-browser-bin updates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Run update script
        id: update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/update-zen-browser-bin.sh
          ./scripts/update-zen-browser-bin.sh

      - name: Pull latest changes
        if: env.NEW_VERSION != ''
        run: |
          git stash
          git pull --rebase origin main
          git stash pop

      - name: Commit and push
        if: env.NEW_VERSION != ''
        uses: EndBug/add-and-commit@v9
        with:
          message: "Update zen-browser-bin to ${{ env.NEW_VERSION }}"
          add: 'srcpkgs/zen-browser-bin/template'
          github_token: ${{ secrets.PAT_TOKEN }}

  # ==================== GOOGLE CHROME ====================
  update-google-chrome-bin:
    name: Check google-chrome-bin updates
    needs: update-zen-browser-bin
    if: always()
